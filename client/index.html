<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Monitor</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Paints the right page colour before the CSS bundle arrives (matters in dev, where CSS loads via JS) */
      html {
        background: #f8fafc;
        color-scheme: light;
      }
      html.dark {
        background: #0b1120;
        color-scheme: dark;
      }
    </style>
    <script>
      // Runs before React: applies the saved theme (or the OS one) to <html>, so there is no wrong-theme flash.
      // "am-theme" must match THEME_STORAGE_KEY in src/config.ts. No value means "System".
      (function () {
        try {
          var saved = localStorage.getItem("am-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
